overrides:
  # Dependabot could not resolve these itself ("security_update_not_possible"):
  # all three are dev-only transitives (eslint 8 → minimatch@3, jsdom/vitest),
  # so the vulnerable version is pinned by a parent that has not released a bump.
  'brace-expansion@1': ^1.1.18
  'js-yaml@4': ^4.3.1
  'undici@7': ^7.29.0
allowBuilds:
  '@swc/core': true
  esbuild: true
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
minimumReleaseAgeExclude:
  - eslint-plugin-react-refresh@0.5.5
