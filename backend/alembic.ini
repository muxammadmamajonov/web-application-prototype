[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC
# URL is read dynamically from app.config.settings.database_url_sync inside env.py.
sqlalchemy.url =

[post_write_hooks]
# Format autogenerated migrations with ruff. Uses the binary from the local
# uv-managed virtualenv so we don't rely on PATH.
hooks = ruff
ruff.type = exec
ruff.executable = .venv/bin/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
